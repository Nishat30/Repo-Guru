<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" fill="none">
  <!-- Main Dark Workspace Background -->
  <rect width="1280" height="640" fill="#171923" />

  <!-- Top Header Bar -->
  <rect width="1280" height="44" fill="#1E1C24" />
  <line x1="0" y1="44" x2="1280" y2="44" stroke="#322C36" stroke-width="1" />

  <!-- Wizard Logo + RepoGuru + Breadcrumb -->
  <rect x="16" y="10" width="24" height="24" rx="6" fill="#F5EFE1" />
  <path d="M28 14L25 22H31L28 14Z" fill="#3B1D52" />
  <ellipse cx="28" cy="22.5" rx="6" ry="1.2" fill="#3B1D52" />
  <text x="48" y="27" fill="#F3EBDD" font-family="Georgia, serif" font-size="16" font-weight="600">RepoGuru</text>
  <text x="128" y="27" fill="#5D5564" font-family="monospace" font-size="13">/</text>
  <rect x="142" y="15" width="14" height="11" rx="2" stroke="#C49A52" stroke-width="1.3" />
  <text x="164" y="26" fill="#D5CBB8" font-family="system-ui, sans-serif" font-size="12">Nishat30/The-Professors-Map</text>

  <!-- Header Right Controls -->
  <rect x="1116" y="9" width="84" height="26" rx="7" fill="#26232D" stroke="#3A323D" />
  <text x="1131" y="26" fill="#E6DEC8" font-family="system-ui, sans-serif" font-size="11.5">+ New Repo</text>
  <rect x="1208" y="9" width="26" height="26" rx="7" fill="#34262E" stroke="#C49A52" stroke-opacity="0.45" />
  <rect x="1215" y="16" width="12" height="10" rx="2" stroke="#C49A52" stroke-width="1.2" />
  <rect x="1242" y="9" width="26" height="26" rx="7" fill="#26232D" stroke="#3A323D" />
  <circle cx="1255" cy="22" r="4.5" stroke="#D5CBB8" stroke-width="1.2" />

  <!-- Left Activity Rail (w=52) -->
  <rect y="44" width="52" height="596" fill="#1B1922" />
  <line x1="52" y1="44" x2="52" y2="640" stroke="#322C36" stroke-width="1" />
  <!-- Explorer Icon (Active) -->
  <rect x="10" y="56" width="32" height="32" rx="8" fill="#362825" />
  <rect x="19" y="65" width="14" height="14" rx="2" stroke="#C49A52" stroke-width="1.4" />
  <!-- Search & Graph Icons -->
  <circle cx="25" cy="112" r="5" stroke="#8C8394" stroke-width="1.4" />
  <line x1="29" y1="116" x2="33" y2="120" stroke="#8C8394" stroke-width="1.4" />
  <circle cx="26" cy="152" r="2.2" stroke="#8C8394" stroke-width="1.3" />
  <circle cx="20" cy="162" r="2.2" stroke="#8C8394" stroke-width="1.3" />
  <circle cx="32" cy="162" r="2.2" stroke="#8C8394" stroke-width="1.3" />
  <line x1="26" y1="154" x2="21" y2="160" stroke="#8C8394" stroke-width="1.1" />
  <line x1="26" y1="154" x2="31" y2="160" stroke="#8C8394" stroke-width="1.1" />
  <line x1="12" y1="184" x2="40" y2="184" stroke="#322C36" stroke-width="1" />
  <!-- Repo Monogram Badge -->
  <rect x="10" y="198" width="32" height="32" rx="9" fill="#92400E" stroke="#C49A52" stroke-width="2" />
  <text x="26" y="219" text-anchor="middle" fill="#FFFDF8" font-family="Georgia, serif" font-size="12" font-weight="700">TH</text>
  <!-- + Button -->
  <rect x="10" y="242" width="32" height="32" rx="9" stroke="#3A323D" stroke-dasharray="3 3" />
  <text x="26" y="263" text-anchor="middle" fill="#8C8394" font-family="system-ui, sans-serif" font-size="16">+</text>

  <!-- File Explorer Column (x=52..276) -->
  <rect x="52" y="44" width="224" height="596" fill="#1C1A23" />
  <line x1="276" y1="44" x2="276" y2="640" stroke="#322C36" stroke-width="1" />
  <!-- Filter Box -->
  <rect x="64" y="54" width="200" height="28" rx="7" fill="#25222D" stroke="#3A323D" />
  <text x="86" y="72" fill="#7C7384" font-family="system-ui, sans-serif" font-size="11.5">Filter files...</text>

  <!-- Tree Items -->
  <g font-family="system-ui, sans-serif" font-size="12.5" fill="#D5CBB8">
    <text x="72" y="106" fill="#C49A52">▾</text><text x="88" y="106">data</text>
    <text x="102" y="128" fill="#5CA378">survey-export.json</text>
    <text x="72" y="152" fill="#C49A52">▾</text><text x="88" y="152">public</text>
    <text x="102" y="175">checkin.html</text>
    <text x="102" y="198" fill="#E2B24E">client.js</text>
    <text x="102" y="221" fill="#E2B24E">config.js</text>
    <text x="102" y="244" fill="#E2B24E">geo.js</text>
    <text x="102" y="267" fill="#E2B24E">illustrate.js</text>
    <text x="102" y="290">index.html</text>
    <text x="102" y="313" fill="#E2B24E">map.js</text>
    <text x="102" y="336">parchment.css</text>
    <text x="102" y="359">rooms.html</text>
    <text x="102" y="382" fill="#E2B24E">share.js</text>
    <text x="102" y="405">survey.html</text>
    <text x="102" y="428">teacher.html</text>
    <text x="102" y="451" fill="#E2B24E">teacher.js</text>
    <text x="72" y="476" fill="#C49A52">▾</text><text x="88" y="476">survey-worker</text>
    <text x="88" y="499" fill="#8C8394">▸  public</text>
    <text x="88" y="522" fill="#8C8394">▸  src</text>
    <text x="102" y="545">README.md</text>
    <text x="102" y="568">schema.sql</text>
    <text x="102" y="591">wrangler.jsonc</text>
    <text x="88" y="616" fill="#5CA378">package.json</text>
  </g>

  <!-- Center Code Viewer (x=276..896) -->
  <rect x="276" y="44" width="620" height="596" fill="#151720" />
  <line x1="896" y1="44" x2="896" y2="640" stroke="#322C36" stroke-width="1" />
  <rect x="566" y="274" width="40" height="40" rx="10" fill="#23222C" stroke="#3A323D" />
  <text x="586" y="299" text-anchor="middle" fill="#C49A52" font-family="monospace" font-size="14" font-weight="700">&lt;/&gt;</text>
  <text x="586" y="340" text-anchor="middle" fill="#F3EBDD" font-family="Georgia, serif" font-size="22" font-weight="600">Select a file to inspect</text>
  <text x="586" y="366" text-anchor="middle" fill="#8C8394" font-family="system-ui, sans-serif" font-size="12.5">Choose any file from the explorer on the left, or click a</text>
  <text x="586" y="384" text-anchor="middle" fill="#8C8394" font-family="system-ui, sans-serif" font-size="12.5">citation badge in the mentor chat to jump straight to the</text>
  <text x="586" y="402" text-anchor="middle" fill="#8C8394" font-family="system-ui, sans-serif" font-size="12.5">referenced lines.</text>

  <!-- Right Senior Mentor Panel (x=896..1280) -->
  <rect x="896" y="44" width="384" height="596" fill="#1A1821" />
  <!-- Mentor Header -->
  <rect x="896" y="44" width="384" height="44" fill="#1E1C24" />
  <line x1="896" y1="88" x2="1280" y2="88" stroke="#322C36" stroke-width="1" />
  <text x="936" y="71" fill="#F3EBDD" font-family="Georgia, serif" font-size="15" font-weight="600">Senior Mentor</text>
  <text x="916" y="71" fill="#C49A52" font-size="13">✦</text>
  <!-- English / Hinglish Toggle -->
  <rect x="1142" y="54" width="124" height="26" rx="7" fill="#26232D" stroke="#3A323D" />
  <rect x="1145" y="57" width="56" height="20" rx="5" fill="#1A1821" />
  <text x="1173" y="71" text-anchor="middle" fill="#F3EBDD" font-family="system-ui, sans-serif" font-size="11" font-weight="600">English</text>
  <text x="1233" y="71" text-anchor="middle" fill="#8C8394" font-family="system-ui, sans-serif" font-size="11">Hinglish</text>

  <!-- Language Index Bar -->
  <rect x="896" y="88" width="384" height="36" fill="#1C1A23" />
  <line x1="896" y1="124" x2="1280" y2="124" stroke="#322C36" stroke-width="1" />
  <text x="912" y="103" fill="#8C8394" font-family="monospace" font-size="9.5" letter-spacing="1.2">LANGUAGE INDEX</text>
  <text x="1264" y="103" text-anchor="end" fill="#B6A998" font-family="monospace" font-size="9.5">JS 68% · HTML 22%</text>
  <rect x="912" y="110" width="352" height="5" rx="2.5" fill="#28242D" />
  <rect x="912" y="110" width="238" height="5" rx="2.5" fill="#C49A52" />
  <rect x="1150" y="110" width="76" height="5" fill="#4A1728" />
  <rect x="1226" y="110" width="38" height="5" rx="2.5" fill="#182B24" />

  <!-- Mentor Prompt & Starter Pills -->
  <text x="1088" y="218" text-anchor="middle" fill="#F3EBDD" font-family="Georgia, serif" font-size="22" font-weight="600">Ask anything about this codebase</text>
  <text x="1088" y="242" text-anchor="middle" fill="#8C8394" font-family="system-ui, sans-serif" font-size="11.5">Explore architecture, trace cross-file flows, or request line-by-line</text>
  <text x="1088" y="258" text-anchor="middle" fill="#8C8394" font-family="system-ui, sans-serif" font-size="11.5">explanations.</text>

  <rect x="944" y="282" width="144" height="30" rx="9" fill="#23202B" stroke="#3A323D" />
  <text x="1016" y="301" text-anchor="middle" fill="#E6DEC8" font-family="system-ui, sans-serif" font-size="11">Explain the architecture</text>
  <rect x="1096" y="282" width="136" height="30" rx="9" fill="#23202B" stroke="#3A323D" />
  <text x="1164" y="301" text-anchor="middle" fill="#E6DEC8" font-family="system-ui, sans-serif" font-size="11">Trace the login flow</text>
  <rect x="1014" y="320" width="148" height="30" rx="9" fill="#23202B" stroke="#3A323D" />
  <text x="1088" y="339" text-anchor="middle" fill="#E6DEC8" font-family="system-ui, sans-serif" font-size="11">Where is the entry point?</text>

  <!-- Chat Input Box -->
  <line x1="896" y1="572" x2="1280" y2="572" stroke="#322C36" stroke-width="1" />
  <rect x="912" y="584" width="352" height="42" rx="12" fill="#211E28" stroke="#3A323D" />
  <text x="928" y="609" fill="#7C7384" font-family="system-ui, sans-serif" font-size="12">Ask about architecture, flows, or specific files...</text>
  <rect x="1226" y="590" width="30" height="30" rx="9" fill="#7A5B32" />
  <text x="1241" y="610" text-anchor="middle" fill="#FFFDF8" font-family="system-ui, sans-serif" font-size="14">↑</text>
</svg>

